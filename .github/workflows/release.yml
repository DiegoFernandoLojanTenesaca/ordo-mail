name: Release

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./app/package.json').version")
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in app/package.json"; exit 1; }

      - name: Check
        run: |
          pnpm --dir app install --frozen-lockfile
          pnpm --dir app check
          cargo fmt --all --check
          pnpm --dir app build
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          git diff --exit-code app/src/lib/bindings

      - name: Build and sign the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm --dir app tauri build
          version=$(node -p "require('./app/package.json').version")
          mv "target/release/bundle/nsis/Ordo_${version}_x64-setup.exe.sig" "ordo-${GITHUB_REF_NAME}.exe.sig"
          mv "target/release/bundle/nsis/Ordo_${version}_x64-setup.exe" "ordo-${GITHUB_REF_NAME}.exe"
          node scripts/latest.mjs "$GITHUB_REF_NAME" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/ordo-${GITHUB_REF_NAME}.exe"

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: CHANGELOG.md
          files: |
            ordo-${{ github.ref_name }}.exe
            latest.json
          fail_on_unmatched_files: true
